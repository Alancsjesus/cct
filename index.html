<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma CCT</title>
<meta name="theme-color" content="#1B2126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: papel de estande — faixa de cabeçalho, abas fixas, painéis em coluna única no celular e duas colunas no desktop */
:root{
  --paper:#ECEFEA; --card:#FAFBF8; --ink:#1B2126; --ink2:#4E5960; --ink3:#7A858B; --line:#D2D8D1;
  --accent:#C2410C; --accent-ink:#FFFFFF; --heat:#24506E;
  --sA:#8C6D12; --sB:#2F5D7C; --sC:#56692A; --sD:#80493A;
  --up:#23784A; --down:#B42318; --warn:#A15C07;
  --f-disp:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171B; --card:#1A2127; --ink:#E5EAE6; --ink2:#AEB8BD; --ink3:#7E8A90; --line:#2D363D;
  --accent:#F07B3F; --accent-ink:#1B1006; --heat:#6FA8D0;
  --sA:#D6B24C; --sB:#77A7C9; --sC:#A3B86A; --sD:#D08B76;
  --up:#55C285; --down:#F0786A; --warn:#E3A23F; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12171B; --card:#1A2127; --ink:#E5EAE6; --ink2:#AEB8BD; --ink3:#7E8A90; --line:#2D363D;
  --accent:#F07B3F; --accent-ink:#1B1006; --heat:#6FA8D0;
  --sA:#D6B24C; --sB:#77A7C9; --sC:#A3B86A; --sD:#D08B76;
  --up:#55C285; --down:#F0786A; --warn:#E3A23F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.65rem} h3{font-size:1.2rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:600}
.muted{color:var(--ink2)} .small{font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabeçalho */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.brand-mark{width:52px;height:52px;flex:none;display:grid;place-items:center}
.brand-mark img{width:52px;height:52px;object-fit:contain}
.brand h1{font-size:1.6rem;text-transform:uppercase}
.brand p{margin:0;color:var(--ink2);font-size:.82rem}
.top .cycle{margin-left:auto;text-align:right}
.top .cycle b{font-family:var(--f-disp);font-size:1.4rem;display:block;line-height:1}
.mode{display:inline-block;margin-top:4px;font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:12px 12px 10px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.92rem;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a.cta{color:var(--accent)}

main{padding-block:22px 64px}
.view{display:grid;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
.panel>header .sp{margin-left:auto}
.cols{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

/* séries */
.series{display:flex;gap:6px;flex-wrap:wrap}
.chip-s{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:700;font-family:var(--f-disp);font-size:1rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip-s i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.chip-s[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:var(--card)}
.chip-s[aria-pressed="true"] i{background:var(--card)}
.sbadge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:4px;background:var(--sc);color:var(--card);font-family:var(--f-disp);font-weight:700;font-size:.9rem;padding:0 5px}

.facts{display:flex;flex-wrap:wrap;gap:8px 28px;padding:4px 0 2px}
.facts div{min-width:0}
.facts b{display:block;font-family:var(--f-disp);font-size:1.5rem;line-height:1.1}

/* tabelas */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.rk tbody tr{cursor:pointer}
.rk tbody tr:hover td{background:color-mix(in oklab,var(--paper) 60%,transparent)}
.pos{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;width:36px}
.nm{font-weight:600;white-space:nowrap}
.nm small{display:block;font-weight:400;color:var(--ink3);font-family:var(--f-mono);font-size:.72rem}
tr.zone td{padding:5px 8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:none;cursor:default}
tr.zone.up td{color:var(--up);background:color-mix(in oklab,var(--up) 9%,transparent)}
tr.zone.dn td{color:var(--down);background:color-mix(in oklab,var(--down) 9%,transparent)}
tr.inUp td:first-child{box-shadow:inset 3px 0 var(--up)}
tr.inDn td:first-child{box-shadow:inset 3px 0 var(--down)}
.big{font-family:var(--f-mono);font-weight:600;font-size:1.02rem}

/* mapa */
.heat td,.heat th{padding:0;border:none}
.heat th{padding:4px 2px;text-align:center}
.heat th.n{text-align:left;padding-right:10px}
.heat td.n{font-weight:600;font-size:.86rem;padding:2px 10px 2px 0;white-space:nowrap}
.hc{height:30px;min-width:40px;margin:1px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;border-radius:3px}
.hc.f{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in oklab,var(--line) 70%,transparent) 4px 5px);color:var(--ink3)}
.heat tfoot td{font-family:var(--f-mono);font-size:.74rem;text-align:center;color:var(--ink2);padding:4px 2px}
.heat tfoot td.n{text-align:left;font-family:var(--f-body)}
.flag{color:var(--warn);font-weight:700}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ink2)}
.legend span{width:18px;height:10px;border-radius:2px;display:inline-block}

.insights{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.insights .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;background:var(--paper);border:1px solid var(--line);font-size:.9rem}

/* perfil */
.prof-head{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.prof-head h2{font-size:2.1rem}
.status{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.status.up{background:color-mix(in oklab,var(--up) 15%,transparent);color:var(--up)}
.status.dn{background:color-mix(in oklab,var(--down) 15%,transparent);color:var(--down)}
.status.mid{background:var(--paper);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis div{background:var(--card);padding:10px 12px}
.kpis b{display:block;font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.kpis small{color:var(--ink3);font-size:.75rem}
.sw{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.sw{grid-template-columns:1fr 1fr}}
.sw h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sw h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.sw ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.sw li b{display:block}
.sw li p{margin:2px 0 0;color:var(--ink2);font-size:.88rem}
.ind{display:grid;gap:9px}
.ind .row{display:grid;grid-template-columns:minmax(110px,150px) 1fr 44px;gap:10px;align-items:center;font-size:.86rem}
.bar{height:10px;background:var(--paper);border-radius:99px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bar.plain::after{display:none}
.bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink3);opacity:.6}

/* formulários */
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--ink2)}
input[type=text],input[type=number],input[type=month],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.fund{display:flex;flex-wrap:wrap;gap:6px}
.fund button,.tag{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.fund button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tag{cursor:default;background:var(--paper)}

/* lançamento */
.roster{display:grid;gap:6px}
.roster button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:5px;padding:10px 12px;cursor:pointer}
.roster button .p{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.roster button .pend{margin-left:auto;font-size:.75rem;color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.roster button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:70px 48px 1fr 48px;align-items:center;gap:8px}
.step .z{font-family:var(--f-disp);font-weight:700;font-size:1.25rem}
.step .z small{display:block;font-family:var(--f-body);font-weight:400;font-size:.7rem;color:var(--ink3)}
.step button{height:48px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-size:1.4rem;font-weight:700;cursor:pointer}
.step output{text-align:center;font-family:var(--f-mono);font-size:1.5rem;font-weight:600}
.totbox{display:flex;align-items:baseline;gap:12px;padding:12px;border-radius:6px;background:var(--paper)}
.totbox b{font-family:var(--f-mono);font-size:2.2rem;line-height:1}
.err{color:var(--down);font-size:.85rem;font-weight:600}
.ok{color:var(--up);font-size:.85rem;font-weight:600}

.tlist{display:grid;gap:10px}
.tcard{border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:grid;gap:6px}
.tcard .h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.tcard .h b{font-family:var(--f-disp);font-size:1.15rem}
.tcard .h .sp{margin-left:auto}
.spec{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink2)}

.drop{border:2px dashed var(--line);border-radius:8px;padding:26px 16px;text-align:center;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--accent)}
.steps-guide{margin:0;padding-left:20px;display:grid;gap:8px}
code{font-family:var(--f-mono);font-size:.85em;background:var(--paper);padding:1px 5px;border-radius:3px;border:1px solid var(--line)}
.note{font-size:.82rem;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.adm-list{display:grid;gap:8px}
.adm-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.adm-row .who-e{font-family:var(--f-mono);font-size:.85rem;word-break:break-all;min-width:0}
.adm-row .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:5px 10px;font-size:.82rem}
.login{max-width:420px}
.chip-s.g{--sc:var(--ink)}
.offline{background:color-mix(in oklab,var(--warn) 14%,var(--card));border:1px solid color-mix(in oklab,var(--warn) 40%,var(--line));color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.copas{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.copa-card{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px 14px;cursor:pointer;display:grid;gap:4px}
.copa-card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.copa-card b{font-family:var(--f-disp);font-size:1.15rem}
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.fase{display:flex;flex-direction:column;gap:10px;min-width:0}
.fase>.fh{position:sticky;top:0}
.fase>.fh b{font-family:var(--f-disp);font-size:1.1rem;display:block}
.fase .fl{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.duel{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.duel.pend{border-style:dashed}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.dl:nth-child(2){border-bottom:none}
.dl .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .sc2{font-family:var(--f-mono);font-size:.82rem;color:var(--ink2);white-space:nowrap}
.dl.win{background:color-mix(in oklab,var(--accent) 10%,var(--card))}
.dl.win .n{color:var(--accent)}
.dl.lose .n{color:var(--ink3);font-weight:500}
.dl.bye .n{color:var(--ink3);font-weight:400;font-style:italic}
.dst{font-size:.74rem;color:var(--ink2);padding:5px 10px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dst .act{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.dst.alert{color:var(--warn);font-weight:600}
.champ{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:6px;background:color-mix(in oklab,var(--sA) 14%,var(--card));border:1px solid color-mix(in oklab,var(--sA) 45%,var(--line))}
.champ b{font-family:var(--f-disp);font-size:1.6rem;line-height:1}
.pick{display:grid;gap:12px}
.pick fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;min-width:0}
.pick legend{font-weight:700;font-family:var(--f-disp);font-size:1.05rem;padding:0 4px;display:flex;gap:8px;align-items:center}
.pick .ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px}
.pick label{display:flex;gap:6px;align-items:center;font-size:.88rem;padding:4px 0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
svg text{font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media(max-width:560px){h2{font-size:1.4rem}.prof-head h2{font-size:1.7rem}.hide-s{display:none}.panel{padding:14px}}
</style>

<div class="top"><div class="wrap">
  <div class="brand-mark" id="brandMark"></div>
  <div class="brand"><h1 id="brandName">CCT</h1><p>Ranking de tiro defensivo · séries A, B, C e D</p></div>
  <div class="cycle"><span class="lbl">Ciclo</span><b id="cycleLbl">2026</b><span class="mode" id="modeLbl"></span></div>
</div></div>
<nav class="tabs" aria-label="Seções"><div class="wrap">
  <a href="#ranking">Ranking</a><a href="#mapa">Mapa de treinos</a><a href="#atirador">Atirador</a><a href="#copas">Copas</a>
  <a href="#lancar" class="cta" data-adm>Lançar resultado</a><a href="#treinos" data-adm>Treinos</a><a href="#importar" data-adm>Importar</a><a href="#ajustes" data-adm>Ajustes</a><a href="#entrar" id="navEntrar" hidden>Área do administrador</a>
</div></nav>
<main class="wrap" id="app"><div class="panel"><p class="muted" style="margin:0">Carregando dados…</p></div></main>

/* ---------- cálculo ---------- */
let RES={},BYID={};
/* Série de cada atirador num ciclo = série dos treinos em que ele atirou naquele ano
   (a mais frequente; no empate, a do treino mais recente). Sem treinos no ciclo, vale o histórico gravado
   no fechamento (coluna historico, ex.: "2026:B") e, por último, a série atual do cadastro.
   Assim, consultar um ciclo antigo depois do acesso/descenso mostra cada um na série em que competiu. */
let SCC={};
function serieDe(aid,ciclo){
  ciclo=String(ciclo??S.config.ciclo);
  const M=SCC[ciclo]||(SCC[ciclo]=(()=>{const tm={};S.treinos.forEach(t=>{if(String(t.mes).startsWith(ciclo))tm[t.id]=t;});const acc={};
    S.resultados.forEach(r=>{const t=tm[r.treino];if(!t)return;const m=acc[r.atirador]=acc[r.atirador]||{};const o=m[t.serie]=m[t.serie]||{n:0,ult:''};o.n++;if(t.mes>o.ult)o.ult=t.mes;});
    const out={};Object.entries(acc).forEach(([aid,ss])=>{out[aid]=Object.entries(ss).sort((a,b)=>b[1].n-a[1].n||b[1].ult.localeCompare(a[1].ult))[0][0];});return out;})());
  if(M[aid])return M[aid];
  const a=BYID[aid];if(!a)return '';
  const h=String(a.historico||'').match(new RegExp('(?:^|;)\\s*'+ciclo+':([ABCD])'));
  return h?h[1]:a.serie;
}
function reindex(){SCC={};RES={};BYID={};S.atiradores.forEach(a=>BYID[a.id]=a);S.resultados.forEach(r=>{(RES[r.treino]=RES[r.treino]||{})[r.atirador]=r;});}
function treinosSerie(serie){return S.treinos.filter(t=>t.serie===serie&&String(t.mes).startsWith(String(S.config.ciclo))).sort((a,b)=>a.mes.localeCompare(b.mes));}
function stat(t){
  const v=Object.values(RES[t.id]||{}).map(r=>r.pts);
  const m=mean(v),s=sdev(v),teto=v.length?v.filter(x=>x>=t.max).length/v.length:0;
  return {n:v.length,m,s,teto,min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null};
}
var STC={};function st(t){return STC[t.id]||(STC[t.id]=stat(t));}
function tScore(t,pts){const s=st(t);return s.s>0?50+10*(pts-s.m)/s.s:50;}
function ranking(serie){
  const ts=treinosSerie(serie);
  const rows=S.atiradores.filter(a=>a.ativo&&serieDe(a.id)===serie).map(a=>{
    const cells=ts.map(t=>(RES[t.id]||{})[a.id]||null);
    const done=cells.map((c,i)=>c?{c,t:ts[i]}:null).filter(Boolean);
    const tv=done.map(d=>tScore(d.t,d.c.pts));
    return {a,cells,pts:done.reduce((s,d)=>s+d.c.pts,0),x:done.reduce((s,d)=>s+d.c.x,0),n:done.length,
      tv,nivel:tv.length?mean(tv):null,reg:tv.length>=3?sdev(tv):null,tend:slope(tv.slice(-6)),
      prec:done.length?done.reduce((s,d)=>s+d.c.x,0)/done.length:null,assid:ts.length?done.length/ts.length:null};
  });
  rows.sort((p,q)=>q.pts-p.pts||(S.config.desempate==='X'?q.x-p.x:0)||q.n-p.n||p.a.nome.localeCompare(q.a.nome));
  const N=rows.length,up=serie==='A'?0:Math.min(+S.config.sobem,N),dn=serie==='D'?0:Math.min(+S.config.descem,Math.max(0,N-up));
  rows.forEach((r,i)=>{r.pos=i+1;r.zona=i<up?'up':(i>=N-dn?'dn':'mid');});
  return {ts,rows,up,dn};
}

function spark(cells,ts){

  const X=i=>n<2?W/2:4+i*(W-8)/(n-1),Y=v=>H-3-(v/100)*(H-6);
  let d='',last=null;cells.forEach((c,i)=>{if(!c){last=null;return;}const p=c.pts/ts[i].max*100;d+=(last===null?'M':'L')+X(i).toFixed(1)+' '+Y(p).toFixed(1)+' ';last=i;});
  let li=-1;cells.forEach((c,i)=>{if(c)li=i;});
  const dot=li>=0?`<circle cx="${X(li)}" cy="${Y(cells[li].pts/ts[li].max*100)}" r="2.6" fill="var(--accent)"/>`:'';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${Y(50)}" y2="${Y(50)}" stroke="var(--line)" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linejoin="round"/>${dot}</svg>`;

function vMapa(){

  const cell=(c,t)=>{if(!c)return `<div class="hc f" title="Falta">·</div>`;const p=c.pts/t.max;const bg=`color-mix(in oklab,var(--heat) ${Math.round(8+p*82)}%,var(--card))`;const fg=p>.55?'var(--card)':'var(--ink)';return `<div class="hc" style="background:${bg};color:${fg}" title="${c.pts} pts · X ${c.x}">${c.pts}</div>`;};
  h+=`<div class="tscroll"><table class="heat"><thead><tr><th class="n lbl">Atirador</th>${ts.map(t=>`<th class="lbl">${MESES[+t.mes.slice(5)-1]}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td class="n">${esc(r.a.nome)}</td>${r.cells.map((c,i)=>`<td>${cell(c,ts[i])}</td>`).join('')}</tr>`;});

  <div class="legend" style="margin-top:10px">0 <span style="background:color-mix(in oklab,var(--heat) 8%,var(--card));border:1px solid var(--line)"></span><span style="background:color-mix(in oklab,var(--heat) 45%,var(--card))"></span><span style="background:color-mix(in oklab,var(--heat) 90%,var(--card))"></span> 100 pts · <span class="hc f" style="width:18px;height:10px;min-width:0;display:inline-block;margin:0"></span> falta</div></div>`;
  // leitura do instrutor
  const ins=[];
  const hard=ts.map((t,i)=>({t,s:S2[i]})).filter(o=>o.s.n>=3).sort((a,b)=>a.s.m/a.t.max-b.s.m/b.t.max);
  if(hard.length){const o=hard[0];ins.push(['!',`<b>${MESES_L[+o.t.mes.slice(5)-1]} foi o treino mais exigente</b>: média ${fmt(o.s.m,0)} pts. Vale reaplicar o exercício mais à frente para medir evolução real.`]);}
  ts.forEach((t,i)=>{if(S2[i].teto>=.4)ins.push(['=',`<b>${MESES_L[+t.mes.slice(5)-1]}: ${fmt(S2[i].teto*100,0)}% fizeram a nota máxima.</b> O treino não separou os atiradores (efeito teto). Para essa série, aumente a dificuldade: menos tempo, mais distância ou alvo reduzido.`]);});
  const elig=rows.filter(r=>r.tv.length>=4);

  if(best&&best.tend>0)ins.push(['↗',`<b>Maior evolução recente: ${esc(best.a.nome)}</b>, +${fmt(best.tend,1)} pontos de índice por treino nos últimos ${Math.min(6,best.tv.length)} meses.`]);
  const reg=[...elig].filter(r=>r.reg!=null).sort((a,b)=>a.reg-b.reg)[0];
  if(reg)ins.push(['≈',`<b>Mais regular: ${esc(reg.a.nome)}</b>. Menor oscilação de desempenho entre os treinos.`]);
  // por arma, último treino com arma informada
  const tArma=[...ts].reverse().find(t=>Object.values(RES[t.id]||{}).some(r=>r.arma));
  let armas='';
  if(tArma){const g={};Object.values(RES[tArma.id]).forEach(r=>{if(!r.arma)return;(g[r.arma]=g[r.arma]||[]).push(r.pts);});
    const L=Object.entries(g).map(([a,v])=>({a,m:mean(v),n:v.length})).sort((p,q)=>q.m-p.m);
    armas=`<div class="panel"><header><h3>Média por arma · ${mesLbl(tArma.mes)}</h3></header><div class="ind">${L.map(o=>`<div class="row"><span>${esc(o.a)} <small class="muted">(${o.n})</small></span><div class="bar plain"><i style="width:${o.m/tArma.max*100}%;background:var(--heat)"></i></div><span class="num r">${fmt(o.m,0)}</span></div>`).join('')}</div><p class="note" style="margin:12px 0 0">Grupos com 1 ou 2 atiradores não permitem conclusão sobre a arma; leia como indício.</p></div>`;}
  h+=`<div class="cols"><div class="panel"><header><h3>Leitura do instrutor</h3></header><ul class="insights">${ins.map(([i,t])=>`<li><span class="ic">${i}</span><span>${t}</span></li>`).join('')||'<li>Sem dados suficientes.</li>'}</ul></div>${armas}</div></section>`;
  return h;
}

function pctile(v,arr,hi){if(v==null||arr.length<2)return null;let w=0,e=0;arr.forEach(a=>{if(a==null)return;if(hi?a<v:a>v)w++;else if(a===v)e++;});const n=arr.filter(a=>a!=null).length;return (w+(e-1)/2)/(n-1);}

   <h3 style="margin-top:18px">Por tipo de treino</h3><div class="ind" style="margin-top:8px">${tl.map(barT).join('')}</div></div>${tgt}</div></section>`;

/* ---------- copas (mata-mata) ---------- */
const listaIds=v=>Array.isArray(v)?v:String(v||'').split(';').map(x=>x.trim()).filter(x=>x!=='').map(x=>x==='-'?null:x);
function copaNorm(c){let dec=c.decisoes;if(typeof dec==='string'){try{dec=JSON.parse(dec||'{}');}catch(e){dec={};}}return {...c,inicio:String(c.inicio).slice(0,7),participantes:listaIds(c.participantes),ranking:listaIds(c.ranking).filter(Boolean),decisoes:dec||{},status:c.status||'ativa'};}
function copaOut(c){return {...c,participantes:c.participantes.map(x=>x||'-').join(';'),ranking:c.ranking.join(';'),decisoes:JSON.stringify(c.decisoes||{})};}
function addMes(m,k){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function resMes(aid,mes){for(const t of S.treinos){if(t.mes!==mes)continue;const r=(RES[t.id]||{})[aid];if(r)return r;}return null;}
function mesLancado(aid,mes){const a=BYID[aid];return S.treinos.some(t=>t.mes===mes&&(!a||t.serie===a.serie)&&Object.keys(RES[t.id]||{}).length>0);}
function nomeFase(n){return {2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final',32:'16 avos de final',64:'32 avos de final'}[n]||('Fase com '+n);}
function duelo(c,k,j,a,b){
  const key=k+'-'+j,mes=addMes(c.inicio,k),o={key,mes,a,b,ra:null,rb:null,w:undefined,st:''};
  if(a===undefined||b===undefined){o.st='Aguardando a fase anterior';return o;}
  if(a===null||b===null){o.w=a||b;o.bye=true;o.st='Passa direto (melhor colocado no Ranking Geral)';return o;}
  o.ra=resMes(a,mes);o.rb=resMes(b,mes);
  const d=c.decisoes[key];
  if(d===a||d===b){o.w=d;o.st='Vencedor definido pelo administrador';o.manual=true;return o;}
  const la=o.ra||mesLancado(a,mes),lb=o.rb||mesLancado(b,mes);
  if(!o.ra&&!o.rb){if(la&&lb){const ia=c.ranking.indexOf(a),ib=c.ranking.indexOf(b);o.w=(ib<0||(ia>=0&&ia<ib))?a:b;o.st='Ambos ausentes: avança o melhor colocado no sorteio';o.wo=true;}else o.st='Aguardando o treino de '+mesLbl(mes);return o;}
  if(!o.ra||!o.rb){if((o.ra&&lb)||(o.rb&&la)){o.w=o.ra?a:b;o.st='Vitória por W.O. (adversário ausente)';o.wo=true;}else o.st='Aguardando o resultado de '+mesLbl(mes);return o;}
  const crit=[['pts','pontos'],['x','X'],['z10','impactos no 10'],['z9','impactos no 9'],['z8','impactos no 8'],['z7','impactos no 7'],['z6','impactos no 6']];
  for(let i=0;i<crit.length;i++){const [f,lab]=crit[i],va=o.ra[f]||0,vb=o.rb[f]||0;if(va!==vb){o.w=va>vb?a:b;o.st=i===0?'Vitória por pontos':'Empate em pontos, decidido por '+lab;return o;}}
  o.st='Empate total: o administrador define o vencedor';o.empate=true;return o;
}
function chave(c){
  const fases=[];let slots=c.participantes.slice();let k=0;
  while(slots.length>=2){const ds=[];for(let j=0;j<slots.length/2;j++)ds.push(duelo(c,k,j,slots[2*j],slots[2*j+1]));fases.push({n:slots.length,mes:addMes(c.inicio,k),ds});slots=ds.map(d=>d.w);k++;}
  const campeao=slots[0]||null;
  const atual=fases.find(f=>f.ds.some(d=>d.w===undefined));
  return {fases,campeao,atual};
}
/* Ranking usado para isenções e desempate de ausência nas copas:
   o do ciclo atual; se ele ainda não tiver treinos, o do ciclo anterior. */
function rankingRef(){let g=rankingGeral();if(!g.meses.length){const p=rankingGeral(String(+S.config.ciclo-1));if(p.meses.length)g=p;}return g;}
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function embaralhar(v){v=v.slice();for(let i=v.length-1;i>0;i--){const j=rnd(i+1);[v[i],v[j]]=[v[j],v[i]];}return v;}
function sortearChave(ids){
  const rk=rankingRef().rows.map(r=>r.a.id);
  const ord=ids.slice().sort((a,b)=>rk.indexOf(a)-rk.indexOf(b));
  let P=2;while(P<ord.length)P*=2;
  const nb=P-ord.length,pares=ord.slice(0,nb).map(x=>rnd(2)?[x,null]:[null,x]);
  const resto=embaralhar(ord.slice(nb));for(let i=0;i<resto.length;i+=2)pares.push([resto[i],resto[i+1]]);
  return {participantes:embaralhar(pares).flat(),ranking:ord};
}
function nomeAt(id){const a=BYID[id];return a?a.nome:'(removido)';}
function dlRow(d,id,r){
  if(id===null)return `<div class="dl bye"><span></span><span class="n">isento</span><span></span></div>`;

  const a=BYID[id],cls=d.w===undefined?'':(d.w===id?'win':'lose');
  return `<div class="dl ${cls}"><span class="sbadge" style="${sc(a?a.serie:'B')}">${a?a.serie:'?'}</span><span class="n">${esc(nomeAt(id))}</span><span class="sc2">${r?`${r.pts} · X${r.x}`:(d.bye||d.w===undefined?'':'falta')}</span></div>`;
}
function vCopas(){
  const cs=S.copas.slice().sort((a,b)=>String(b.criado_em||b.inicio).localeCompare(String(a.criado_em||a.inicio)));
  let h=`<section class="view"><div class="panel"><header><h2>Copas</h2>${AUTH.admin&&!ui.novaCopa?`<span class="sp"></span><button class="btn pri" id="novaCopa">Nova copa</button>`:''}</header><p class="muted small" style="margin:0">Mata-mata com chave sorteada. Cada fase usa o treino do mês como duelo: vence quem fizer mais pontos; no empate, mais X e depois mais impactos no 10. Quem falta perde por W.O. As copas não alteram o ranking das séries.</p></div>`;
  if(ui.novaCopa&&AUTH.admin)h+=formCopa();

  if(!cs.length)return h+'</section>';
  if(!ui.copa||!cs.find(c=>c.id===ui.copa))ui.copa=cs[0].id;
  h+=`<div class="panel"><div class="copas">${cs.map(c=>{const k=chave(c),n=c.participantes.filter(Boolean).length;return `<button class="copa-card" data-copa="${esc(c.id)}" aria-current="${c.id===ui.copa}"><b>${esc(c.nome)}</b><span class="small muted">${n} atiradores · início ${mesLbl(c.inicio)}</span><span class="small">${k.campeao?`Campeão: <b style="font-size:inherit;font-family:inherit">${esc(nomeAt(k.campeao))}</b>`:k.atual?`Em andamento · ${nomeFase(k.atual.n)} (${mesLbl(k.atual.mes)})`:''}</span></button>`;}).join('')}</div></div>`;
  const c=cs.find(x=>x.id===ui.copa),k=chave(c);
  h+=`<div class="panel"><header><h3>${esc(c.nome)}</h3><span class="sp small muted">${k.fases.length} fases · ${mesLbl(c.inicio)} a ${mesLbl(addMes(c.inicio,k.fases.length-1))}</span></header>`;
  if(k.campeao){const a=BYID[k.campeao],f=k.fases[k.fases.length-1].ds[0],r=f.w===f.a?f.ra:f.rb;h+=`<div class="champ" style="margin-bottom:14px"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--sA)" stroke-width="2.5"/><circle cx="17" cy="17" r="9" fill="none" stroke="var(--sA)" stroke-width="2.5"/><circle cx="17" cy="17" r="3.5" fill="var(--sA)"/></svg><span><span class="lbl">Campeão</span><br><b>${esc(nomeAt(k.campeao))}</b></span><span class="small muted">Série ${a?a.serie:'?'}${r?` · final com ${r.pts} pts e ${r.x} X`:''}</span></div>`;}
  h+=`<div class="bracket">${k.fases.map((f,fi)=>`<div class="fase"><div class="fh"><b>${nomeFase(f.n)}</b><span class="small muted">${mesLbl(f.mes)}</span></div><div class="fl">${f.ds.map(d=>{

async function lerArquivo(f){
  ui.imp=null;
  try{
    if(/\.pdf$/i.test(f.name)){
      if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';}
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      const linhas=[];
      for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows=[];tc.items.forEach(it=>{const s=it.str.trim();if(!s)return;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,it:[]};rows.push(r);}r.it.push({x:it.transform[4],s});});rows.sort((a,b)=>b.y-a.y).forEach(r=>linhas.push(r.it.sort((a,b)=>a.x-b.x)));}
      ui.imp=parsePdfTreino(linhas,f.name);
    }else{
      if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      ui.imp=parseAoa(aoa,f.name);
    }
  }catch(e){ui.imp={erro:'Não consegui ler o arquivo: '+(e.message||e)};}
  render();
}
function metaFromText(txt,mesDefault){
  const m={mes:mesDefault,serie:ui.serie,tipo:'Tiro Defensivo',alvo:'',distancia:'',tempo:'',angulo:'',empunhadura:''};
  const T=norm(txt);
  const mm=T.match(/(JANEIRO|FEVEREIRO|MARCO|ABRIL|MAIO|JUNHO|JULHO|AGOSTO|SETEMBRO|OUTUBRO|NOVEMBRO|DEZEMBRO)\s*\/?\s*(\d{4})/);
  if(mm){const i=['JANEIRO','FEVEREIRO','MARCO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'].indexOf(mm[1]);m.mes=mm[2]+'-'+String(i+1).padStart(2,'0');}
  const a=txt.match(/ALVO\s+([^-\n]+?)\s*-/i);if(a)m.alvo=a[1].trim().replace(/\(([^)]+)\)/,(x,y)=>'('+y.charAt(0)+y.slice(1).toLowerCase()+')');
  const t=T.match(/(\d+)\s*S\b/);if(t)m.tempo=+t[1];
  const d=T.match(/(\d+(?:[.,]\d+)?)\s*M\b/);if(d)m.distancia=+d[1].replace(',','.');
  const g=txt.match(/(\d+)\s*[º°]/);if(g)m.angulo=g[1]+'º';
  if(/EMP\.?\s*DUPLA/.test(T))m.empunhadura='Dupla';else if(/MAO FRACA/.test(T))m.empunhadura='Mão fraca';else if(/MAO FORTE/.test(T))m.empunhadura='Mão forte';
  const s=T.match(/\bSERIE\s+([ABCD])\b/)||T.match(/[_\s-]([ABCD])\.PDF$/);if(s)m.serie=s[1];
  return m;
}
function parsePdfTreino(L,arquivo){
  const hi=L.findIndex(r=>r.some(i=>/^nome$/i.test(i.s))&&r.some(i=>/^total$/i.test(i.s)));
  if(hi<0)throw new Error('não encontrei o cabeçalho com “Nome” e “Total”. Este leitor de PDF aceita a planilha de treino; para o ranking geral use o arquivo Excel.');
  const H=L[hi],hx=k=>(H.find(i=>i.s.toUpperCase()===k)||{}).x;
  const zc=ZONAS.map(z=>({z,x:hx(String(z))})).filter(o=>o.x!=null);
  const xX=hx('X'),xArma=hx('ARMA'),xTot=hx('TOTAL'),xNome=hx('NOME');
  const meta=metaFromText(L.slice(0,hi).map(r=>r.map(i=>i.s).join(' ')).join('\n')+' '+arquivo,ui.serie&&new Date().toISOString().slice(0,7));
  const rows=[];
  L.slice(hi+1).forEach(r=>{
    const nomeIt=r.find(i=>/[A-ZÀ-Ú]{2,}/i.test(i.s)&&(xArma==null||i.x<xArma-10));if(!nomeIt)return;
    const armaIt=xArma!=null?r.find(i=>i!==nomeIt&&i.x>=xArma-25&&i.x<(xX??xArma+60)-15):null;
    const nums=r.filter(i=>i!==nomeIt&&i!==armaIt&&i.x>nomeIt.x&&/^\d+$/.test(i.s)).map(i=>({x:i.x,v:+i.s}));
    const tot=xTot!=null?nums.filter(n=>n.x>=xTot-15).pop():null;
    const xv=xX!=null?nums.find(n=>Math.abs(n.x-xX)<=15):null;
    const acc={};zc.forEach(o=>acc[o.z]={c:null,p:null});
    nums.filter(n=>n!==tot&&n!==xv).forEach(n=>{let b=null,bd=1e9;zc.forEach(o=>{const d=Math.abs(n.x-(o.x+12));if(d<bd){bd=d;b=o;}});if(b){if(n.x<b.x)acc[b.z].c=n.v;else acc[b.z].p=n.v;}});
    const z={};zc.forEach(o=>{const a=acc[o.z];z[o.z]=a.c!=null?a.c:(a.p!=null?Math.round(a.p/o.z):0);});
    rows.push({nome:nomeIt.s.trim(),arma:armaIt?armaIt.s:'',x:xv?xv.v:0,z,total:tot?tot.v:null});
  });
  if(!rows.length)throw new Error('não encontrei linhas de atiradores.');
  return {tipo:'treino',arquivo,meta,rows};
}
function parseAoa(A,arquivo){
  const hi=A.findIndex(r=>r.some(c=>/^nome$/i.test(String(c).trim())));
  if(hi<0)throw new Error('não encontrei a coluna “Nome”.');
  const H=A[hi].map(c=>norm(c));
  const cN=H.indexOf('NOME');
  const mi=H.map((h,i)=>{const k=['JAN','FEV','MAR','ABR','MAIO','JUN','JUL','AGO','SET','OUT','NOV','DEZ'].indexOf(h==='MAI'?'MAIO':h);return k>=0?[k+1,i]:null;}).filter(Boolean);
  const titulo=A.slice(0,hi).map(r=>r.join(' ')).join('\n');
  if(mi.length>=3){
    const ano=(titulo.match(/\b(20\d{2})\b/)||[])[1]||(titulo.match(/\/(\d{2})\b/)||[])[1]&&'20'+titulo.match(/\/(\d{2})\b/)[1]||S.config.ciclo;
    const sr=(norm(titulo).match(/RANKING\s+([ABCD])\b/)||[])[1]||ui.serie;
    const rows=[];const ms=new Set();
    A.slice(hi+1).forEach(r=>{const nome=String(r[cN]||'').trim();if(!nome||!/[A-Za-zÀ-ú]/.test(nome))return;const m={};
      mi.forEach(([mes,i])=>{const v=r[i];if(v===''||v==null||isNaN(+v))return;const xv=H[i-1]==='X'?+r[i-1]||0:0;m[mes]={pts:+v,x:xv};ms.add(mes);});rows.push({nome,m});});
    return {tipo:'ranking',arquivo,serie:sr,ano:+ano,rows,meses:[...ms].sort((a,b)=>a-b)};
  }
  const col=k=>H.indexOf(k);
  const cA=col('ARMA'),cX=col('X'),cT=col('TOTAL');
  const zcol=ZONAS.map(z=>[z,col(String(z))]);
  const rows=[];
  A.slice(hi+1).forEach(r=>{const nome=String(r[cN]||'').trim();if(!nome||!/[A-Za-zÀ-ú]/.test(nome))return;const z={};
    zcol.forEach(([zz,i])=>{if(i<0){z[zz]=0;return;}const c=r[i],p=r[i+1];z[zz]=(c!==''&&!isNaN(+c))?+c:((p!==''&&!isNaN(+p))?Math.round(+p/zz):0);});
    rows.push({nome,arma:cA>=0?String(r[cA]).trim():'',x:cX>=0?+r[cX]||0:0,z,total:cT>=0&&r[cT]!==''?+r[cT]:null});});
  return {tipo:'treino',arquivo,meta:metaFromText(titulo+' '+arquivo,new Date().toISOString().slice(0,7)),rows};
}

    I.rows.forEach(r=>{const aid=resolve(r);if(!aid)return;const o={treino:id,atirador:aid,arma:r.arma,x:r.x,pts:0};ZONAS.forEach(z=>{o['z'+z]=r.z[z]||0;o.pts+=z*(r.z[z]||0);});res.push(o);});
    if(novos.length)await Store.upsert('atiradores',novos);
    await Store.upsert('treinos',[t]);await Store.upsert('resultados',res);
    ui.serie=serie;ui.treino=id;
  }else{
    const ano=$('#iAno').value,ts=[];
    I.meses.forEach(m=>{const id=`${ano}-${String(m).padStart(2,'0')}-${serie}`;if(!S.treinos.find(t=>t.id===id))ts.push({id,mes:id.slice(0,7),serie,tipo:'Tiro Defensivo',alvo:'',distancia:'',tempo:'',angulo:'',empunhadura:'',disparos:10,max:100,fundamentos:[],obs:'Importado do ranking geral'});});
    I.rows.forEach(r=>{const aid=resolve(r);if(!aid)return;Object.entries(r.m).forEach(([m,v])=>res.push({treino:`${ano}-${String(m).padStart(2,'0')}-${serie}`,atirador:aid,arma:'',x:v.x,z10:null,z9:null,z8:null,z7:null,z6:null,pts:v.pts}));});
    if(novos.length)await Store.upsert('atiradores',novos);
    if(ts.length)await Store.upsert('treinos',ts);await Store.upsert('resultados',res);
    ui.serie=serie;
  }
  ui.imp=null;toast(`${res.length} resultados gravados`);location.hash='#ranking';render();
}

/* ---------- render e eventos ---------- */
function route(){return (location.hash||'#ranking').slice(1);}
function render(){
  for(const k in STC)delete STC[k];
  $('#brandMark').innerHTML=logoMark();$('#brandName').textContent=S.config.nome||'CCT';$('#cycleLbl').textContent=S.config.ciclo;$('#modeLbl').textContent=OFFLINE?'Sem conexão':GASRUN?'Google Planilhas':API_URL?'App':'Demonstração';
  let r=route();
  document.querySelectorAll('nav.tabs [data-adm]').forEach(a=>a.hidden=!AUTH.admin);$('#navEntrar').hidden=AUTH.admin;
  if(ADM_ROUTES.includes(r)&&!AUTH.admin){ui.depoisEntrar=r;r='entrar';}
  if(r==='entrar'&&AUTH.admin)r='ajustes';
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+r?'page':'false'));
  const V={ranking:vRanking,mapa:vMapa,atirador:vAtirador,lancar:vLancar,treinos:vTreinos,importar:vImportar,ajustes:vAjustes,entrar:vEntrar,copas:vCopas}[r]||vRanking;
  $('#app').innerHTML=(OFFLINE?`<div class="offline" style="margin-bottom:16px">Sem conexão. Mostrando os dados salvos em ${new Date(OFFLINE).toLocaleString('pt-BR')}. Lançamentos ficam indisponíveis até a conexão voltar.</div>`:'')+V();bind(r);
}
function bind(r){
  bindSerie();
  if(r==='copas')bindCopas();
  document.querySelectorAll('[data-at]').forEach(tr=>tr.onclick=()=>{if(tr.dataset.ats)ui.serie=tr.dataset.ats;ui.atirador=tr.dataset.at;location.hash='#atirador';});
  const sa=$('#selAt');if(sa)sa.onchange=()=>{ui.atirador=sa.value;render();};
  if(r==='lancar'){
    const sT=$('#selT');if(sT)sT.onchange=()=>{ui.treino=sT.value;ui.edit=null;render();};
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const t=S.treinos.find(x=>x.id===ui.treino),a=BYID[b.dataset.pick];ui.edit=a.id;const c=(RES[t.id]||{})[a.id];ui.draft=c?{...c,z10:c.z10??Math.round(c.pts/10),z9:c.z9??0,z8:c.z8??0,z7:c.z7??0,z6:c.z6??0}:blankRes(t,a);render();if(innerWidth<900)$('#editor').scrollIntoView({behavior:'smooth',block:'start'});});
    bindEditor();
  }
  if(r==='treinos'){
    $('#novoT').onclick=()=>{const d=new Date();ui.editTreino={id:'',mes:d.toISOString().slice(0,7),serie:ui.serie,tipo:'Tiro Defensivo',alvo:'A4 (Moreira)',distancia:'',tempo:'',angulo:'',empunhadura:'Dupla',disparos:10,max:100,fundamentos:[],obs:''};render();};
    document.querySelectorAll('[data-edt]').forEach(b=>b.onclick=()=>{ui.editTreino=JSON.parse(JSON.stringify(S.treinos.find(t=>t.id===b.dataset.edt)));render();scrollTo({top:0,behavior:'smooth'});});
    if(ui.editTreino){
      document.querySelectorAll('#tFund button').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
      $('#cancT').onclick=()=>{ui.editTreino=null;render();};
      $('#salvarT').onclick=async()=>{const e=ui.editTreino,mes=$('#tMes').value,serie=$('#tSerie').value;if(!mes){toast('Informe o mês do treino');return;}
        const t={...e,id:e.id||mes+'-'+serie,mes,serie,tipo:$('#tTipo').value,alvo:$('#tAlvo').value,distancia:$('#tDist').value,tempo:$('#tTempo').value,angulo:$('#tAng').value,empunhadura:$('#tEmp').value,disparos:+$('#tDisp').value||10,max:(+$('#tDisp').value||10)*10,obs:$('#tObs').value,fundamentos:[...document.querySelectorAll('#tFund button')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.textContent)};
        try{await Store.upsert('treinos',[t]);ui.editTreino=null;ui.serie=serie;toast('Treino salvo');render();}catch(err){toast('Erro ao salvar: '+err.message);}};
    }
  }
  if(r==='importar'){
    const inp=$('#arq'),dz=$('#drop');inp.onchange=()=>inp.files[0]&&lerArquivo(inp.files[0]);
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)lerArquivo(f);};
    document.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{ui.imp.rows[+s.dataset.map].map=s.value;});
    const c=$('#confImp');if(c)c.onclick=async()=>{c.disabled=true;try{await gravarImport();}catch(e){c.disabled=false;toast('Erro: '+e.message);}};
    const d=$('#descImp');if(d)d.onclick=()=>{ui.imp=null;render();};
  }
  if(r==='entrar'){
    $('#fLogin').onsubmit=async ev=>{ev.preventDefault();const b=$('#lBtn'),er=$('#lErr');er.hidden=true;b.disabled=true;b.textContent='Entrando…';
      try{const q=await gas('api_login',{email:$('#lEmail').value,pin:$('#lPin').value});AUTH=q;tokenSet(q.token);ADMS=null;toast('Bem-vindo, '+(q.nome||q.email));location.hash='#'+(ui.depoisEntrar||'lancar');render();}
      catch(e){er.textContent=e.message;er.hidden=false;b.disabled=false;b.textContent='Entrar';}};
  }
  if(r==='ajustes'&&GAS){
    if(!ADMS)gas('api_admins',AUTH.token).then(d=>{ADMS=d;if(route()==='ajustes')render();}).catch(e=>toast(e.message));
    const sa=$('#sair');if(sa)sa.onclick=async()=>{try{await gas('api_logout',AUTH.token);}catch(e){}AUTH={admin:false};tokenSet('');ADMS=null;ADMEDIT=null;toast('Sessão encerrada');location.hash='#ranking';render();};
    const nv=$('#aNovo');if(nv)nv.onclick=()=>{ADMEDIT={novo:true};render();};
    const cn=$('#aCanc');if(cn)cn.onclick=()=>{ADMEDIT=null;render();};
    document.querySelectorAll('[data-admpin]').forEach(b=>b.onclick=()=>{ADMEDIT={email:b.dataset.admpin};render();});
    document.querySelectorAll('[data-admrm]').forEach(b=>b.onclick=()=>{ADMEDIT={email:b.dataset.admrm,confirmRm:true};render();});
    document.querySelectorAll('[data-admat]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await gas('api_admin_salvar',{token:AUTH.token,email:b.dataset.admat,ativo:b.dataset.v==='1'});ADMS=null;toast('Acesso atualizado');render();}catch(e){b.disabled=false;toast(e.message);}});
    const rm=$('#aRmSim');if(rm)rm.onclick=async()=>{rm.disabled=true;try{await gas('api_admin_remover',{token:AUTH.token,email:ADMEDIT.email});toast(ADMEDIT.email+' removido');ADMEDIT=null;ADMS=null;render();}catch(e){rm.disabled=false;toast(e.message);}};
    const sv=$('#aSalvar');if(sv)sv.onclick=async()=>{const er=$('#aErr');er.hidden=true;const pin=$('#aPin').value.trim();
      const p=ADMEDIT.novo?{email:$('#aEmail').value.trim(),nome:$('#aNome').value.trim(),pin}:{email:ADMEDIT.email,pin};
      if(!/^\d{6,12}$/.test(pin)){er.textContent='O PIN deve ter de 6 a 12 números.';er.hidden=false;return;}
      sv.disabled=true;try{await gas('api_admin_salvar',{token:AUTH.token,...p});toast(ADMEDIT.novo?'Administrador cadastrado':'PIN redefinido');ADMEDIT=null;ADMS=null;render();}catch(e){sv.disabled=false;er.textContent=e.message;er.hidden=false;}};
  }
  if(r==='ajustes'){
    let logo=S.config.logo;
    $('#cLogo').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,256/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);logo=cv.toDataURL('image/png');document.querySelector('.panel .brand-mark').innerHTML=`<img src="${logo}" alt="">`;};img.src=rd.result;};rd.readAsDataURL(f);};
    $('#salvarC').onclick=async()=>{try{await Store.saveConfig({nome:$('#cNome').value.trim()||'CCT',ciclo:$('#cCiclo').value,sobem:+$('#cSobem').value,descem:+$('#cDescem').value,desempate:$('#cDes').value,logo});toast('Ajustes salvos');render();}catch(e){toast('Erro: '+e.message);}};
    $('#addAt').onclick=async()=>{const n=$('#nNome').value.trim();if(!n){toast('Informe o nome de guerra');return;}let id=slug(n),k=2;while(BYID[id])id=slug(n)+'-'+k++;await Store.upsert('atiradores',[{id,nome:n.toUpperCase(),serie:$('#nSerie').value,arma:$('#nArma').value.trim(),ativo:true}]);toast(n.toUpperCase()+' cadastrado na Série '+$('#nSerie').value);render();};
    const f=$('#fech');if(f)f.onclick=()=>{FECH=true;render();};
    const fn=$('#fechNao');if(fn)fn.onclick=()=>{FECH=false;render();};
    const fs=$('#fechSim');if(fs)fs.onclick=async()=>{fs.disabled=true;const ciclo=String(S.config.ciclo),novo={};
      SERIES.forEach(s=>{const {rows}=ranking(s);rows.forEach(r=>{novo[r.a.id]=r.zona==='up'?prevS(s):r.zona==='dn'?nextS(s):s;});});
      const hist=a=>{const v=String(a.historico||'').split(';').map(x=>x.trim()).filter(x=>x&&!x.startsWith(ciclo+':'));v.push(ciclo+':'+serieDe(a.id));return v.join(';');};
      const rows=S.atiradores.filter(a=>novo[a.id]).map(a=>({...a,historico:hist(a),serie:novo[a.id]}));
      const n=rows.filter(r=>r.serie!==BYID[r.id].serie).length;
      try{await Store.upsert('atiradores',rows);FECH=false;toast(n+' atiradores movimentados · séries de '+ciclo+' registradas');render();}catch(e){fs.disabled=false;toast('Erro: '+e.message);}};
    const rs=$('#resetD');if(rs)rs.onclick=async()=>{await Store.reset();toast('Dados originais restaurados');render();};
  }
}
function bindEditor(){
  const t=S.treinos.find(x=>x.id===ui.treino);
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const k=b.dataset.inc;ui.draft[k]=(ui.draft[k]||0)+1;if(k==='x'&&ui.draft.x>(ui.draft.z10||0))ui.draft.z10=ui.draft.x;$('#editor').innerHTML=editorHtml(t);bindEditor();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const k=b.dataset.dec;ui.draft[k]=Math.max(0,(ui.draft[k]||0)-1);$('#editor').innerHTML=editorHtml(t);bindEditor();});
  const ar=$('#arma');if(ar)ar.oninput=()=>ui.draft.arma=ar.value;
  const cc=$('#cancelar');if(cc)cc.onclick=()=>{ui.edit=null;render();};
  const sv=$('#salvar');if(sv)sv.onclick=async()=>{sv.disabled=true;const d=ui.draft;d.pts=ZONAS.reduce((s,z)=>s+z*(d['z'+z]||0),0);try{await Store.upsert('resultados',[{...d}]);const nm=BYID[d.atirador].nome;
    const ats=S.atiradores.filter(a=>a.ativo&&serieDe(a.id)===ui.serie).sort((a,b)=>a.nome.localeCompare(b.nome));const nx=ats.find(a=>!(RES[t.id]||{})[a.id]);
    if(nx){ui.edit=nx.id;ui.draft=blankRes(t,nx);}else ui.edit=null;toast(`${nm}: ${d.pts} pontos salvos`);render();}catch(e){sv.disabled=false;toast('Erro ao salvar: '+e.message);}};
}
window.addEventListener('hashchange',render);
if(GASRUN&&google.script.url)google.script.url.getLocation(l=>{if(l&&l.parameter&&l.parameter.page==='admin'&&!location.hash){location.hash='#entrar';}});
Store.load().then(render).catch(e=>{$('#app').innerHTML=`<div class="panel"><p class="err">Não foi possível carregar os dados: ${esc(e.message||e)}</p></div>`;});
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
